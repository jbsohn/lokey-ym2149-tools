[workspace]
members = ["ym-core", "lym"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
authors = ["John Sohn <john.sohn@gmail.com>"]

[workspace.dependencies]
thiserror = "2.0"
clap = { version = "4.0", features = ["derive"] }
ym2149 = "0.9.1"
ym2149-ym-replayer = "0.9.1"
ym2149-common = "0.9.1"
cpal = "0.18.0"
indicatif = "0.18.6"
console = "0.16.4"
flate2 = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
