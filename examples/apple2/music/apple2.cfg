# ld65 linker configuration for Apple II raw binary
# Loads at $0803 with a BLOAD-compatible header ($0800-$0802)
# DOS 3.3 occupies $9600-$BFFF, so ROM must end before $9600.

MEMORY {
    ROM: start = $0803, size = $8DFD, fill = no, file = %O;
}

SEGMENTS {
    CODE:   load = ROM, type = ro;
    RODATA: load = ROM, type = ro;
}
